name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: this workflow provides its own APP_ENV=test env vars (see the `env:`
# blocks below) instead of relying on committed .env.test contents, because
# real process env vars always win over Dotenv-loaded values in Symfony. This
# keeps the pipeline green independent of local dotenv file conventions.
env:
  APP_ENV: test
  APP_SECRET: 'ci-test-secret-do-not-use-in-prod'
  DATABASE_URL: 'postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8'
  MESSENGER_TRANSPORT_DSN: 'in-memory://'
  MAILER_DSN: 'null://null'
  DEFAULT_URI: 'http://localhost'
  GEMINI_API_KEY: ''

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U app"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: 'postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: ctype, iconv, intl, mbstring, pdo, pdo_pgsql, zip, gd, dom, simplexml, xmlwriter, curl

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create test database and load seed
        env:
          USABILITY_SEED_ENABLED: '1'
        run: |
          bin/console doctrine:database:create --if-not-exists --env=test
          bin/console doctrine:schema:create --env=test
          bin/console app:usability:seed --env=test

      - name: Run test suite
        run: composer test

  static-analysis:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: ctype, iconv, intl, mbstring, pdo, pdo_pgsql, zip, gd, dom, simplexml, xmlwriter, curl

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-8.3-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Warm up test container (needed by phpstan-symfony)
        run: bin/console cache:warmup --env=test

      - name: Run PHPStan
        run: composer analyse

  coding-standards:
    name: Coding Standards (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: ctype, iconv, intl, mbstring, pdo, pdo_pgsql, zip, gd, dom, simplexml, xmlwriter, curl

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.3-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-8.3-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run php-cs-fixer (advisory — does not fail CI)
        run: |
          set +e
          vendor/bin/php-cs-fixer check --diff --show-progress=none > cs.out 2>&1
          status=$?
          { echo '### php-cs-fixer (advisory — does not fail CI)'; echo '```diff'; cat cs.out; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  deploy:
    name: Deploy to Dokploy
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy
        run: |
          curl -fsS -X POST \
            "https://dokploy.mojeda.site/api/trpc/application.deploy?batch=1" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -d '{"0":{"json":{"applicationId":"abkpgAERWTHYe83QNhpKH"}}}'
